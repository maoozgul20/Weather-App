<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Weather App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Weather App</h1>
        <form id="searchForm" class="input-container">
            <label for="city" class="visually-hidden">City name</label>
            <input type="text" id="city" placeholder="Enter City Name" autocomplete="off" required>
            <button type="submit" id="getWeatherBtn">Search</button>
        </form>
        <div class="weather-info" aria-live="polite">
            <p id="statusMessage" class="status-message"></p>
            <h2 id="cityName"></h2>
            <img id="weatherIcon" src="" alt="" hidden>
            <div class="weather-card" hidden>
                <div class="weather-item">
                    <div class="weather-item-left">
                        <span class="icon" aria-hidden="true">🌡️</span>
                        <span>Temperature:</span>
                    </div>
                    <span id="temperature"></span>
                </div>
                <div class="weather-item">
                    <div class="weather-item-left">
                        <span class="icon" aria-hidden="true">💨</span>
                        <span>Feels like:</span>
                    </div>
                    <span id="feellike"></span>
                </div>
                <div class="weather-item">
                    <div class="weather-item-left">
                        <span class="icon" aria-hidden="true">☁️</span>
                        <span>Condition:</span>
                    </div>
                    <span id="weatherDescription"></span>
                </div>
                <div class="weather-item">
                    <div class="weather-item-left">
                        <span class="icon" aria-hidden="true">💧</span>
                        <span>Humidity:</span>
                    </div>
                    <span id="humidity"></span>
                </div>
                <div class="weather-item">
                    <div class="weather-item-left">
                        <span class="icon" aria-hidden="true">📊</span>
                        <span>Pressure:</span>
                    </div>
                    <span id="pressure"></span>
                </div>
                <div class="weather-item">
                    <div class="weather-item-left">
                        <span class="icon" aria-hidden="true">👁️</span>
                        <span>Visibility:</span>
                    </div>
                    <span id="visibility"></span>
                </div>
            </div>
        </div>
    </main>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
