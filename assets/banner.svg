<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Weather App banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3c72"/>
      <stop offset="0.55" stop-color="#2a5298"/>
      <stop offset="1" stop-color="#6a82fb"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe082" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="58" ry="30"/>
      <ellipse cx="-38" cy="10" rx="40" ry="24"/>
      <ellipse cx="40" cy="12" rx="44" ry="22"/>
      <ellipse cx="6" cy="-20" rx="36" ry="28"/>
    </g>
    <line id="drop" x1="0" y1="0" x2="-4" y2="14" stroke="#cfe3ff" stroke-width="2.5" stroke-linecap="round"/>
    <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#sky)"/>

    <!-- Stars twinkling -->
    <g fill="#ffffff">
      <circle cx="80" cy="50" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="34" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="70" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="300" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="300" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Sun with rotating rays -->
    <g transform="translate(1010 110)">
      <circle r="120" fill="url(#sunGlow)">
        <animate attributeName="r" values="110;128;110" dur="4s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#ffd54f" stroke-width="6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <line x1="0" y1="-62" x2="0" y2="-82"/>
        <line x1="0" y1="62" x2="0" y2="82"/>
        <line x1="-62" y1="0" x2="-82" y2="0"/>
        <line x1="62" y1="0" x2="82" y2="0"/>
        <line x1="44" y1="44" x2="58" y2="58"/>
        <line x1="-44" y1="-44" x2="-58" y2="-58"/>
        <line x1="44" y1="-44" x2="58" y2="-58"/>
        <line x1="-44" y1="44" x2="-58" y2="58"/>
      </g>
      <circle r="48" fill="#ffca28"/>
    </g>

    <!-- Drifting clouds -->
    <g fill="#ffffff" opacity="0.92">
      <g>
        <animateTransform attributeName="transform" type="translate" values="930 150; 880 150; 930 150" dur="14s" repeatCount="indefinite"/>
        <use href="#cloud" transform="scale(0.9)"/>
      </g>
    </g>
    <g fill="#e3ecff" opacity="0.55">
      <g>
        <animateTransform attributeName="transform" type="translate" values="150 80; 230 80; 150 80" dur="18s" repeatCount="indefinite"/>
        <use href="#cloud" transform="scale(0.7)"/>
      </g>
    </g>

    <!-- Rain cloud with falling drops -->
    <g transform="translate(760 250)">
      <g fill="#b0c4de" opacity="0.9"><use href="#cloud" transform="scale(0.75)"/></g>
      <g>
        <use href="#drop" x="-40" y="30"><animate attributeName="y" values="20;80" dur="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.9s" repeatCount="indefinite"/></use>
        <use href="#drop" x="-12" y="30"><animate attributeName="y" values="20;80" dur="0.9s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/></use>
        <use href="#drop" x="16" y="30"><animate attributeName="y" values="20;80" dur="0.9s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/></use>
        <use href="#drop" x="44" y="30"><animate attributeName="y" values="20;80" dur="0.9s" begin="0.15s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.9s" begin="0.15s" repeatCount="indefinite"/></use>
      </g>
    </g>

    <!-- Glass card with title -->
    <rect x="70" y="92" width="560" height="190" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="110" y="168" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Weather App</text>
    <text x="112" y="212" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#e3ecff">Live weather · Dynamic backgrounds · Smooth animations</text>
    <text x="112" y="250" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#c5d5f5">HTML · CSS · JavaScript · OpenWeatherMap</text>
  </g>
</svg>
